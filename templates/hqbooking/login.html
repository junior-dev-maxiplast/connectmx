{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva da Sede - Login</title>
    <link rel="stylesheet" href="{% static 'style/hqbooking.css' %}">
    <link href='https://fonts.googleapis.com/css?family=Open Sans' rel='stylesheet'>
</head>
<body class="hqb-page">
    <main class="hqb-login-wrap">
        <section class="hqb-login-card">
            <h1>Reserva da Sede</h1>
            <p>Entre com sua matricula para acessar o calendario.</p>

            {% if error_message %}
                <div class="hqb-alert hqb-alert-error">{{ error_message }}</div>
            {% endif %}

            <form method="POST" action="{% url 'hqbooking_login_submit' %}" class="hqb-login-form">
                {% csrf_token %}
                <label for="employee_id">Matricula</label>
                <input id="employee_id" name="employee_id" type="text" maxlength="20" placeholder="Ex: 10452" required>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
